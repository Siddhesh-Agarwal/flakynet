[project]
name = "flakynet"
version = "0.1.0"
description = "Seeded, reproducible network faults for testing real clients over real sockets."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Siddhesh Agarwal" }
]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "pyright>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flakynet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests that need a real service",
    "timing_sensitive: tests with wall-clock tolerances",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["README.md", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.10"
include = ["src"]
exclude = ["**/__pycache__"]
# Public constructors validate untrusted/untyped inputs at runtime.
reportUnnecessaryIsInstance = false
